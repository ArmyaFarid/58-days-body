<!doctype html>
<html lang="fr">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
        <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
        <meta name="theme-color" content="#0a0a0a" media="(prefers-color-scheme: dark)" />
        <title>Hors ligne — 58 jours</title>
        <style>
            :root {
                --bg: #ffffff;
                --fg: #0a0a0a;
                --muted: #737373;
                --border: #e5e5e5;
            }
            @media (prefers-color-scheme: dark) {
                :root {
                    --bg: #0a0a0a;
                    --fg: #fafafa;
                    --muted: #a3a3a3;
                    --border: #262626;
                }
            }
            html,
            body {
                height: 100%;
                margin: 0;
                overscroll-behavior: none;
            }
            body {
                display: flex;
                align-items: center;
                justify-content: center;
                padding: max(24px, env(safe-area-inset-top)) 24px max(24px, env(safe-area-inset-bottom));
                box-sizing: border-box;
                background: var(--bg);
                color: var(--fg);
                font-family: system-ui, -apple-system, sans-serif;
                -webkit-tap-highlight-color: transparent;
            }
            main {
                max-width: 320px;
                text-align: center;
            }
            img {
                width: 56px;
                height: 56px;
                border-radius: 14px;
            }
            h1 {
                font-size: 1.25rem;
                margin: 16px 0 8px;
            }
            p {
                color: var(--muted);
                font-size: 0.9rem;
                line-height: 1.5;
                margin: 0 0 20px;
            }
            button {
                font: inherit;
                font-weight: 600;
                height: 44px;
                padding: 0 20px;
                border-radius: 10px;
                border: 1px solid var(--border);
                background: var(--fg);
                color: var(--bg);
                touch-action: manipulation;
            }
        </style>
    </head>
    <body>
        <main>
            <img src="/icon-192.png" alt="" />
            <h1>Pas de connexion</h1>
            <p>Tes séances et tes données sont enregistrées en ligne. Reconnecte-toi pour continuer : rien n'est perdu.</p>
            <button type="button" onclick="location.reload()">Réessayer</button>
        </main>
    </body>
</html>
